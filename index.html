<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#8b1e1e">
  <title>শালিখা সার্বজনীন দুর্গামন্দির</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="temple-name">শালিখা সার্বজনীন দুর্গামন্দির</div>
    <div class="visitor-count">👥 <span id="visitorCount">০</span> জন অনলাইনে</div>
    <a class="fb-btn" href="https://www.facebook.com/share/1C4vHcS65b/" target="_blank" rel="noopener noreferrer" aria-label="Facebook">f</a>
  </header>

  <main>
    <section class="hero">
      <div class="glow"></div>
      <p class="eyebrow">শুভ মহালয়া</p>
      <h1>মহালয়া আসছে</h1>

      <div class="countdown" id="countdown">
        <div><strong id="days">০</strong><span>দিন</span></div>
        <div><strong id="hours">০</strong><span>ঘণ্টা</span></div>
        <div><strong id="minutes">০</strong><span>মিনিট</span></div>
        <div><strong id="seconds">০</strong><span>সেকেন্ড</span></div>
      </div>

      <p class="subtitle">ষষ্ঠী পূজা আসছে</p>
      <p class="date-note">১৬ অক্টোবর ২০২৬</p>

      <button class="dhak-btn" id="dhakBtn" type="button" aria-label="ঢাক বাজান">
        <span class="dhak-icon">🥁</span>
        <span>ঢাক বাজান</span>
      </button>
      <audio id="dhakAudio" src="audio/dhak(1).mp3" preload="metadata"></audio>
    </section>

    <section class="songs">
      <h2>গানের তালিকা</h2>

      <div class="song-card">
        <div>
          <b>১. প্রথম গান</b>
          <small>1.mp3</small>
        </div>
        <button class="play-btn" data-audio="song1">▶</button>
        <audio id="song1" src="audio/1.mp3" preload="metadata"></audio>
      </div>

      <div class="song-card">
        <div>
          <b>২. দ্বিতীয় গান</b>
          <small>2.mp3</small>
        </div>
        <button class="play-btn" data-audio="song2">▶</button>
        <audio id="song2" src="audio/2.mp3" preload="metadata"></audio>
      </div>
    </section>
  </main>

  <footer>
    <p>created by <strong>ARONNA DAS</strong></p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
